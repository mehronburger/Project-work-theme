 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ГДЗ">
  <title>ГДЗ и Презентации</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --input: #2c2c2e;
      --text: #ffffff;
      --sub: #8e8e93;
      --accent: #0a84ff;
      --green: #30d158;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 24px);
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--card); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; gap: 8px; }
    input, textarea, button {
      font-size: 16px;
      border: none;
      border-radius: 12px;
      outline: none;
    }
    input, textarea {
      width: 100%;
      background: var(--input);
      color: var(--text);
      padding: 12px;
    }
    textarea { resize: vertical; min-height: 70px; }
    button {
      padding: 13px 16px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }
    button:active { opacity: 0.7; }
    button:disabled { background: #3a3a3c; color: var(--sub); }
    .btn-sec { background: var(--input); color: var(--text); }
    .btn-pres { background: #5e5ce6; }
    .upload-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--input);
      padding: 14px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .files-list { display: flex; gap: 8px; flex-wrap: wrap; }
    .thumb {
      width: 64px; height: 64px; border-radius: 10px; object-fit: cover;
      border: 1px solid #3a3a3c;
    }
    .pdf-badge {
      background: #2c2c2e; padding: 6px 10px; border-radius: 8px;
      font-size: 13px; color: #ff453a; font-weight: 600;
    }
    .output {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      min-height: 120px;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 15px;
      word-wrap: break-word;
    }
    .status { font-size: 12px; color: var(--sub); text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <input type="password" id="apiKey" placeholder="Вставьте Gemini API Key">
        <button type="button" class="btn-sec" style="width: auto;" onclick="saveKey()">Сохранить</button>
      </div>
      <div class="status" id="keyStatus">Ключ хранится только в памяти вашего iPhone</div>
    </div>

    <div class="card">
      <label class="upload-box">
        <span>📎 Добавить фото / скриншоты / PDF</span>
        <input type="file" id="fileInput" accept="image/*,application/pdf,text/plain" multiple hidden onchange="processFiles(this.files)">
      </label>

      <div class="files-list" id="preview"></div>

      <textarea id="userText" placeholder="Текст задания или тема презентации (необязательно, если прикреплены файлы)"></textarea>

      <div class="row">
        <button type="button" id="btnHw" style="flex: 1;" onclick="run('hw')">Решить ДЗ</button>
        <button type="button" id="btnPres" class="btn-pres" style="flex: 1;" onclick="run('pres')">Презентация</button>
      </div>
      <button type="button" class="btn-sec" onclick="clearAll()">Очистить всё</button>
    </div>

    <div class="output" id="output">Готово к работе.</div>
    <button type="button" class="btn-sec" id="copyBtn" onclick="copyText()">Скопировать ответ</button>
  </div>

  <script>
    const PROMPT_HW = "Ты ГДЗ. Решай ДЗ максимально кратко, насколько это возможно. Без вопросов, без вступлений, без обращений на «ты» и без лишних объяснений. Просто выдавай готовые ответы (номер вопроса — ответ) при отправке фото, файлов или текста.";
    const PROMPT_PRES = "Создай готовую структуру и текст презентации по присланным материалам или теме. Без вступлений, без вопросов и без обращений на «ты». Формат: Слайд 1: Заголовок и тезисы, Слайд 2: Заголовок и тезисы и так далее. Максимально чётко и по делу.";

    let attachments = [];

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const saved = localStorage.getItem('gdz_gemini_key');
        if (saved) {
          document.getElementById('apiKey').value = saved;
          document.getElementById('keyStatus').textContent = 'API-ключ активен';
          document.getElementById('keyStatus').style.color = '#30d158';
        }
      } catch (e) {}
    });

    function saveKey() {
      const val = document.getElementById('apiKey').value.trim();
      const st = document.getElementById('keyStatus');
      try {
        localStorage.setItem('gdz_gemini_key', val);
        st.textContent = val ? 'Ключ сохранён на устройстве' : 'Ключ удалён';
        st.style.color = val ? '#30d158' : '#8e8e93';
      } catch (e) {
        st.textContent = 'Ошибка сохранения: отключите Частный доступ в Safari';
        st.style.color = '#ff453a';
      }
    }

    function clearAll() {
      attachments = [];
      document.getElementById('preview').innerHTML = '';
      document.getElementById('userText').value = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('output').textContent = 'Очищено.';
    }

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxW = 1600;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            resolve({
              mimeType: 'image/jpeg',
              data: dataUrl.split(',')[1],
              previewUrl: dataUrl
            });
          };
        };
      });
    }

    function readFileBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({
          mimeType: file.type || 'application/pdf',
          data: reader.result.split(',')[1],
          name: file.name
        });
      });
    }

    async function processFiles(fileList) {
      const preview = document.getElementById('preview');
      for (const file of fileList) {
        if (file.type.startsWith('image/')) {
          const compressed = await compressImage(file);
          attachments.push({ inlineData: { mimeType: compressed.mimeType, data: compressed.data } });
          const img = document.createElement('img');
          img.src = compressed.previewUrl;
          img.className = 'thumb';
          preview.appendChild(img);
        } else {
          const doc = await readFileBase64(file);
          attachments.push({ inlineData: { mimeType: doc.mimeType, data: doc.data } });
          const badge = document.createElement('div');
          badge.className = 'pdf-badge';
          badge.textContent = '📄 ' + doc.name;
          preview.appendChild(badge);
        }
      }
    }

    async function run(mode) {
      const key = document.getElementById('apiKey').value.trim() || localStorage.getItem('gdz_gemini_key');
      const text = document.getElementById('userText').value.trim();
      const output = document.getElementById('output');
      const btnHw = document.getElementById('btnHw');
      const btnPres = document.getElementById('btnPres');

      if (!key) {
        output.textContent = 'Укажите Gemini API Key в верхнем поле.';
        return;
      }
      if (!text && attachments.length === 0) {
        output.textContent = 'Добавьте фото, PDF или текст.';
        return;
      }

      btnHw.disabled = true;
      btnPres.disabled = true;
      output.textContent = 'Выполняется...';

      const parts = [...attachments];
      if (text) parts.push({ text });

      const sysPrompt = mode === 'pres' ? PROMPT_PRES : PROMPT_HW;

      try {
        const response = await fetch(`https://googleapis.com{encodeURIComponent(key)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: sysPrompt }] },
            contents: [{ parts }]
          })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          output.textContent = 'Ошибка: ' + (data.error && data.error.message ? data.error.message : response.statusText);
        } else {
          const answer = data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] ? data.candidates[0].content.parts[0].text : 'Пустой ответ.';
          output.textContent = answer.trim();
        }
      } catch (err) {
