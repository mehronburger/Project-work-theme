 <body>
  <div class="wrap">
    <div class="header">
      <h1>🏴‍☠️ ONE PIECE • ГДЗ</h1>
      <div class="header-sub">Grand Line Study Assistant</div>
    </div>
    <div class="bounty-card">
      <div class="wanted-banner">⚓ Лог Пос • Навигация ⚓</div>
      <div class="row">
        <input type="password" id="apiKey" placeholder="🗝️ Вставьте Gemini API Key">
        <button type="button" class="btn-save" style="width: auto;" onclick="saveKey()">ОК</button>
      </div>
      <div class="status" id="keyStatus">Ключ хранится только в трюме вашего iPhone</div>
    </div>
    <div class="bounty-card">
      <div class="wanted-banner">📜 Карта Сокровищ • Задания 📜</div>
      <label class="upload-box">
        <span>🧭 Загрузить фото, скриншоты или PDF</span>
        <input type="file" id="fileInput" accept="image/*,application/pdf,text/plain" multiple hidden onchange="processFiles(this.files)">
      </label>
      <div class="files-list" id="preview"></div>
      <textarea id="userText" placeholder="✍️ Текст задания или тема презентации..."></textarea>
      <div class="row">
        <button type="button" class="btn-hw" id="btnHw" style="flex: 1;" onclick="run('hw')">👒 Решить ДЗ</button>
        <button type="button" class="btn-pres" id="btnPres" style="flex: 1;" onclick="run('pres')">🗺️ Презентация</button>
      </div>
      <button type="button" class="btn-sec" onclick="clearAll()">🌊 Очистить палубу</button>
    </div>
    <div class="output" id="output">Готов к отплытию на Гранд Лайн! 🏴‍☠️</div>
    <button type="button" class="btn-copy" id="copyBtn" onclick="copyText()">💰 Забрать добычу (Копировать)</button>
  </div>

  <script>
    const PROMPT_HW = "Ты ГДЗ. Решай ДЗ максимально кратко, насколько это возможно. Без вопросов, без вступлений, без обращений на «ты» и без лишних объяснений. Просто выдавай готовые ответы (номер вопроса — ответ) при отправке фото, файлов или текста.";
    const PROMPT_PRES = "Создай готовую структуру и текст презентации по присланным материалам или теме. Без вступлений, без вопросов и без обращений на «ты». Формат: Слайд 1: Заголовок и тезисы, Слайд 2: Заголовок и тезисы и так далее. Максимально чётко и по делу.";
    let attachments = new Array();

    try {
      const saved = localStorage.getItem('gdz_gemini_key');
      if (saved) {
        document.getElementById('apiKey').value = saved;
        document.getElementById('keyStatus').textContent = '✅ Лог Пос настроен • Ключ активен';
        document.getElementById('keyStatus').style.color = '#15803d';
      }
    } catch (e) {}

    function saveKey() {
      const val = document.getElementById('apiKey').value.trim();
      const st = document.getElementById('keyStatus');
      try {
        localStorage.setItem('gdz_gemini_key', val);
        st.textContent = val ? '✅ Ключ сохранён на корабле!' : 'Ключ удалён';
        st.style.color = val ? '#15803d' : '#6b4c35';
      } catch (e) {
        st.textContent = '⚠️ Отключите «Частный доступ» в Safari';
        st.style.color = '#dc2626';
      }
    }

    function clearAll() {
      attachments = new Array();
      document.getElementById('preview').innerHTML = '';
      document.getElementById('userText').value = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('output').textContent = 'Палуба чиста! 🌊';
    }

    function compressImage(file) {
      return new Promise(function(resolve) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(e) {
          const img = new Image();
          img.src = e.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const maxW = 1600;
            let w = img.width;
            let h = img.height;
            if (w > maxW) { h = Math.round((h * maxW) / w); w = maxW; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            resolve({ mimeType: 'image/jpeg', data: dataUrl.split(',').pop(), previewUrl: dataUrl });
          };
        };
      });
    }

    function readFileBase64(file) {
      return new Promise(function(resolve) {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function() {
          resolve({ mimeType: file.type || 'application/pdf', data: reader.result.split(',').pop(), name: file.name });
        };
      });
    }

    async function processFiles(fileList) {
      const preview = document.getElementById('preview');
      const files = Array.from(fileList);
      for (const file of files) {
        if (file.type.startsWith('image/')) {
          const compressed = await compressImage(file);
          attachments.push({ inlineData: { mimeType: compressed.mimeType, data: compressed.data } });
          const img = document.createElement('img');
          img.src = compressed.previewUrl;
          img.className = 'thumb';
          preview.appendChild(img);
        } else {
          const doc = await readFileBase64(file);
          attachments.push({ inlineData: { mimeType: doc.mimeType, data: doc.data } });
          const badge = document.createElement('div');
          badge.className = 'pdf-badge';
          badge.textContent = '📜 ' + doc.name;
          preview.appendChild(badge);
        }
      }
    }

    async function run(mode) {
      const key = document.getElementById('apiKey').value.trim() || localStorage.getItem('gdz_gemini_key');
      const text = document.getElementById('userText').value.trim();
      const output = document.getElementById('output');
      const btnHw = document.getElementById('btnHw');
      const btnPres = document.getElementById('btnPres');

      if (!key) { output.textContent = '⚠️ Укажите Gemini API Key в верхнем поле.'; return; }
      if (!text && attachments.length === 0) { output.textContent = '⚠️ Добавьте фото, PDF или текст.'; return; }

      btnHw.disabled = true; btnPres.disabled = true;
      output.textContent = '⛵ Плывём за ответом...';

      const parts = attachments.slice();
      if (text) { parts.push({ text: text }); }

      const sysPrompt = mode === 'pres' ? PROMPT_PRES : PROMPT_HW;
      const sysParts = new Array(); sysParts.push({ text: sysPrompt });
      const contentsArr = new Array(); contentsArr.push({ parts: parts });
      const apiUrl = 'https://' + '://googleapis.com' + '/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(key);

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ systemInstruction: { parts: sysParts }, contents: contentsArr })
        });
        const data = await response.json();
        if (!response.ok || data.error) {
          output.textContent = 'Ошибка: ' + (data.error && data.error.message ? data.error.message : response.statusText);
        } else {
          const firstCand = data.candidates ? data.candidates.at(0) : null;
          const firstPart = firstCand && firstCand.content && firstCand.content.parts ? firstCand.content.parts.at(0) : null;
          const answer = firstPart && firstPart.text ? firstPart.text : 'Пустой ответ.';
          output.textContent = answer.trim();
        }
      } catch (err) {
        output.textContent = 'Ошибка соединения: ' + err.message;
      } finally {
        btnHw.disabled = false; btnPres.disabled = false;
      }
    }

    function copyText() {
      const text = document.getElementById('output').textContent;
      if (navigator.clipboard) { navigator.clipboard.writeText(text); }
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ Добыча в сундуке!';
      setTimeout(function() { btn.textContent = '💰 Забрать добычу (Копировать)'; }, 1500);
    }
  </script>
</body>
</html>
